name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c

jobs:
  test:
    name: Test (edge + client)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Test and build (ProGuard included)
        run: mvn -B clean verify -Prelease --settings .github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .

  preview:
    name: Publish preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [test, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Preview version
        id: version
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          BASE=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout | sed 's/-SNAPSHOT//')
          VERSION="${BASE}-PR${{ github.event.pull_request.number }}-${SHA}-SNAPSHOT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          {
            echo "Java previews:"
            echo "- \`com.zqnt:zqnt-sdk-java-edge:${VERSION}\`"
            echo "- \`com.zqnt:zqnt-sdk-java-client:${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set version
        run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Publish to GitHub Packages
        run: mvn -B -Prelease deploy -DskipTests --settings .github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            const dep = (artifact) => [
              '<dependency>',
              '    <groupId>com.zqnt</groupId>',
              `    <artifactId>${artifact}</artifactId>`,
              `    <version>${version}</version>`,
              '</dependency>',
            ].join('\n');
            const body = [
              '### Preview published',
              '',
              'Repository: `https://maven.pkg.github.com/Zequent/zqnt-sdk-java`',
              '',
              '```xml',
              dep('zqnt-sdk-java-edge'),
              dep('zqnt-sdk-java-client'),
              '```',
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
